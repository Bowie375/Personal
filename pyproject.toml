[project]
name = "robot-forge"
version = "0.1.0"
description = "Build a robot from gears to manipulation tasks, aligned with real-world physics."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "mujoco>=3.10.0",
    "numpy>=2.5.1",
    "pybullet>=3.2.7",
    "scipy>=1.18.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-timeout>=2.4.0",
    "ruff>=0.15.21",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
